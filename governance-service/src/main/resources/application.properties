spring.application.name=governance-service
server.port=8081

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/governance_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Topic
kafka.topic.governance-events=governance-events
kafka.topic.audit-recorded=audit-recorded
kafka.topic.audit-failed=audit-failed

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# gRPC Client — points to audit-service gRPC server
grpc.client.audit-service.address=static://localhost:9091
grpc.client.audit-service.negotiation-type=plaintext
grpc.audit-service.host=localhost
grpc.audit-service.port=9091

# Outbox Pattern — scheduler delay in ms
outbox.publisher.delay-ms=5000
