spring.application.name=api-gateway
server.port=8080

# Redis for rate limiting
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Gateway routes - Governance Service
spring.cloud.gateway.routes[0].id=governance-service
spring.cloud.gateway.routes[0].uri=lb://governance-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/policies/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=governance-cb
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/governance
spring.cloud.gateway.routes[0].filters[1].name=JwtAuthFilter
spring.cloud.gateway.routes[0].filters[2].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[2].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[2].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[0].filters[2].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[0].filters[2].args.key-resolver=#{@ipKeyResolver}

# Gateway routes - Audit Service
spring.cloud.gateway.routes[1].id=audit-service
spring.cloud.gateway.routes[1].uri=lb://audit-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/audit-logs/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=audit-cb
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/audit
spring.cloud.gateway.routes[1].filters[1].name=JwtAuthFilter
spring.cloud.gateway.routes[1].filters[2].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[2].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[1].filters[2].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[1].filters[2].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[1].filters[2].args.key-resolver=#{@ipKeyResolver}

# Gateway routes - Auth endpoint (no JWT filter, no rate limiter)
spring.cloud.gateway.routes[2].id=auth-service
spring.cloud.gateway.routes[2].uri=lb://api-gateway
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/**

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Resilience4j Circuit Breaker - Governance
resilience4j.circuitbreaker.instances.governance-cb.sliding-window-size=10
resilience4j.circuitbreaker.instances.governance-cb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.governance-cb.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.governance-cb.permitted-number-of-calls-in-half-open-state=3

# Resilience4j Circuit Breaker - Audit
resilience4j.circuitbreaker.instances.audit-cb.sliding-window-size=10
resilience4j.circuitbreaker.instances.audit-cb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.audit-cb.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.audit-cb.permitted-number-of-calls-in-half-open-state=3

