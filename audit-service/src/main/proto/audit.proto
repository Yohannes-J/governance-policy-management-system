syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.audit.audit_service.grpc";
option java_outer_classname = "AuditProto";

package audit;

// ─── RecordAudit ────────────────────────────────────────────────────────────

message RecordAuditRequest {
  string event_type = 1;
  int64  policy_id  = 2;
  string actor      = 3;
  string timestamp  = 4;
}

message RecordAuditResponse {
  bool   success    = 1;
  int64  audit_id   = 2;
  string message    = 3;
}

// ─── GetAuditLogsByPolicy ────────────────────────────────────────────────────

message GetAuditLogsRequest {
  int64 policy_id = 1;
}

message AuditLogEntry {
  int64  id         = 1;
  string event_type = 2;
  int64  policy_id  = 3;
  string actor      = 4;
  string timestamp  = 5;
}

message GetAuditLogsResponse {
  repeated AuditLogEntry logs = 1;
}

// ─── Service ─────────────────────────────────────────────────────────────────

service AuditService {
  rpc RecordAudit          (RecordAuditRequest)    returns (RecordAuditResponse);
  rpc GetAuditLogsByPolicy (GetAuditLogsRequest)   returns (GetAuditLogsResponse);
}
